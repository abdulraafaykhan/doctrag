# All limits, model names and switches live here. Code must not hardcode any of them.
# Free-tier numbers change often: confirm the marked ones in the Groq console and Google AI Studio.

bank:
  name: "Harbourline Bank"
  city: "Mumbai"
  currency: "INR"

models:
  # CONFIRM model ids in the Groq console / AI Studio before first run (they change).
  agent: "local/default"                   # switch back to groq/qwen/qwen3.8-27b to use Groq first
  # Previous agent fallbacks: [groq/qwen/qwen3.8-27b, groq/openai/gpt-oss-20b, gemini/gemini-flash-lite-latest]
  agent_fallbacks: []
  # Previous vision: ingest=gemini-3.5-flash -> groq/qwen/qwen3.8-27b; online=groq/qwen/qwen3.8-27b -> gemini-3.5-flash
  vlm_ingest: "local/default"
  vlm_ingest_fallbacks: []
  vlm_online: "local/default"
  vlm_online_fallbacks: []
  embed: "gemini-embedding-001"
  embed_dims: 768
  reranker: "BAAI/bge-reranker-base"         # only used if features.reranker is true
  temperature: 0.1

local_llm:
  server_id: "161"
  max_tokens: 400
  max_tokens_tool: 200
  max_tokens_writer: 200
  writer_extract_chars: 400
  writer_extract_prefix: 'Here is what our documents say:'
  writer_source_label: '{title}, page {page}'
  writer_raw_answer_chars: 300
  writer_output_preview_chars: 200
  writer_answer_label: 'Answer:'
  writer_strip_labels: [Answer, Assistant, Response, Final answer]
  min_grounded_ratio: 0.6
  grounded_min_word_chars: 4
  grounded_stop_words: [about, after, again, also, although, always, among, another, anyone, anything, because, been, before, being, below, between, both, could, does, doing, down, during, each, either, else, even, every, from, further, have, having, here, into, itself, just, more, most, much, must, neither, never, only, other, ours, ourselves, over, please, same, should, since, some, such, than, that, their, theirs, them, themselves, then, there, these, they, this, those, through, under, until, upon, very, want, were, what, when, where, whether, which, while, whom, will, with, within, without, would, your, yours, yourself, yourselves]
  stop_markers: ["\nUser:", "\nAssistant:", "\nHuman:", "\nCustomer:"]
  raw_output_chars: 200
  document_reference_words: [above, this, attached, attachment, attachments, image, images, screenshot, screenshots, file, files, document, documents, pdf, pdfs]
  balance_words: [balance, balances]
  routing_passthrough_words: [human, agent, person, escalate, escalation, fraud, stolen, lost, distress, login, authenticate, authentication, verify, otp]
  image_token_cost: 1429  # observed 1555 server prompt tokens minus 126 estimated text tokens
  timeout_seconds: 25
  text_field: "response"
  protocol_retries: 1
  context_limit_tokens: 6500
  max_prompt_chars: 16000  # /api/inference OpenAPI constraint
  error_text_chars: 120
  history_token_budget: 300
  retrieval:
    context_token_budget: 1800
    parents_to_model: 4
  enabled_tools: [search_bank_knowledge, search_my_documents, start_authentication, get_balance, chequebook_set_slots, flow_status, flow_summary, flow_cancel, escalate_to_human]
  direct_display_tools: [chequebook_set_slots, flow_summary, flow_status, flow_cancel, get_balance, start_authentication]
  scope_instruction: 'Support bank questions, uploaded documents, balance and cheque book, plus actions explicitly offered by the visible tools; decline other requests in one sentence and offer a human.'
  tool_result_instruction: 'Use the tool results above to answer now with {"reply":"..."}. Call another tool only if information is still missing.'
  final_reply_instruction: 'No tools are available now. Answer from the tool results already given with exactly {"reply":"..."}; do not request tools or invent missing facts.'
  image_encoding: data_url  # optional image string; never inserted into the text prompt

features:
  reranker: false        # needs extra install (sentence-transformers); keep off until eval needs it
  docling: false
  vlm: true
  otp_demo_mode: true    # any 6 digits are accepted

auth:
  otp_length: 6
  otp_expiry_minutes: 5
  otp_max_attempts: 3
  otp_max_resends: 3
  lock_minutes: 10
  held_messages_max: 3

session:
  idle_minutes: 15
  lease_seconds: 600
  expires_hours: 24
  history_turns: 12

agent:
  max_steps: 4
  max_tool_calls: 6
  tool_retry: 1
  max_message_chars: 4000

flow:
  idle_minutes: 15
  pending_action_minutes: 15

uploads:
  max_mb: 10
  max_files_per_session: 5
  max_files_per_message: 5
  digital_pages_per_file: 30
  chunks_per_file: 120
  chunks_per_session: 200
  scanned_pages_per_file: 15
  vlm_pages_per_file: 5
  vlm_pages_per_session: 10
  user_chunks_total: 5000
  expiry_hours: 24
  allowed_extensions: [pdf, pptx, docx, xlsx, csv, md, txt, png, jpg, jpeg, webp]

quotas:                       # per Pacific day; CONFIRM real numbers in AI Studio
  llm_requests_per_day: 1000
  embed_requests_per_day: 1000
  embed_reserved_for_queries: 300
  embed_pace_per_minute: 80
  vlm_requests_per_day: 100
  upload_guard_percent: 70    # above this, new uploads wait

chunking:
  prose_tokens: [300, 400]
  overlap_percent: 12
  parent_max_tokens: 1000
  table_max_tokens: 500
  row_max_tokens: 80
  rate_rows_cap: 5000
  chars_per_token: 4

ocr:
  engine: "rapidocr"
  min_confidence: 0.90
  render_dpi: 250

retrieval:
  result_float_decimals: 3
  candidates_each: 20
  rrf_k: 60
  rerank_to: 6
  parents_to_model: 5
  context_token_budget: 1200
  min_score: 0.55             # tune on the eval set

statement:
  presets: [last_5, last_10, last_30_days, custom]
  max_range_days: 90
  page_size: 50

formats:
  mobile_regex: "^[6-9][0-9]{9}$"
  account_digits: 12
  pin_digits: 6

retention:
  audit_log_days: 30
  image_cache_hours: 24

logging:
  level: "INFO"               # LOG_LEVEL in .env overrides
  file: "data/logs/app.log"
  mask_pii: true
  max_bytes: 5242880
  backup_count: 3
  message_chars: 80
  slow_query_ms: 300

database:
  name: harbourline
  timeout_ms: 15000
  max_pool_size: 10
  index_poll_seconds: 5
  index_wait_seconds: 600
  vector_index: chunks_vector

llm:
  timeout_seconds: 25
  vlm_ingest_timeout_seconds: 90
  vlm_online_timeout_seconds: 25
  vision_json_retries: 1
  retry_attempts: 2
  retry_wait_seconds: 1

money:
  symbol: "₹"
  decimal_places: 2
  months_per_year: 12
  rounding: ROUND_HALF_UP

seed:
  customers: 10
  transactions_per_account: 48
  history_days: 120

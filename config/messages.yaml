# All fixed customer-facing wording. Code builds the final text from these; the LLM does not write them.
auth:
  need_both: "To help with that I need to verify you first. Please share your registered mobile number and your account number."
  need_mobile: "Please share your registered mobile number."
  need_account: "Please share your 12-digit account number."
  otp_sent: "I've sent a 6-digit code to your registered mobile number. Enter it to continue. (Demo: any 6 digits work.)"
  otp_bad_format: "Please enter the 6-digit code."
  otp_wrong: "That code didn't work. You have {left} tries left."
  otp_expired: "That code has expired. Say \"resend\" and I'll send a new one."
  verified: "You're verified."
  generic_fail: "I couldn't verify those details. Please check them and try again."
  locked: "Too many attempts. Please try again in {minutes} minutes."
  cancelled: "Okay, I've cancelled the verification. I can still help with general bank questions."
  session_expired: "For your security I've logged you out after a period of inactivity. Please verify again to continue."
flow:
  confirm_unclear: "Please reply Confirm to submit, Change to edit something, or Cancel."
  expired: "That request expired. Would you like to start again?"
  busy: "You have a {flow} request open. Please finish or cancel it first."
  cancelled: "Done, I've cancelled that request."
  submitted_error: "I couldn't submit that just now, and nothing was created. Please try again."
answers:
  not_found: "I don't have that information in the bank's documents. Would you like me to connect you with our team?"
  unverified_number: "I couldn't confirm that figure against our documents, so I won't guess. Would you like me to connect you with our team?"
  out_of_scope: "I can help with Harbourline Bank accounts, cards, cheque books, rates and policies."
  retry_later: "I'm having trouble right now. Please try again in a moment."
  handoff: "I've passed this to our team. Your reference is {ref_no}."
upload:
  vision_unavailable: "Image analysis is unavailable. This is local OCR text only and may be inaccurate."
  too_large: "That file is larger than {max_mb} MB."
  type_not_allowed: "I can't read that type of file. I can read PDF, PowerPoint, Word, Excel, CSV, Markdown, text and images."
  corrupt: "I couldn't open that file. It may be damaged."
  password_protected: "That file is password protected, so I can't read it."
  partial: "I read the first {done} of {total} pages because of upload limits."
  busy: "Document processing is busy right now. Please try again later. Bank questions still work."
  unreadable_image: "I can't read this image reliably. Could you send a clearer one?"
  expired: "This file has expired and was removed."
  deleted: "I've deleted {n} file(s)."
